name: Monday funding sweep

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday, 05:00 UTC (7:00 in Germany in summer, 6:00 in winter)
  workflow_dispatch:       # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch this week's funding rounds
        run: python fetch_rounds.py
      - name: Save results
        run: |
          git config user.name "funding-radar-bot"
          git config user.email "funding-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Monday sweep $(date +%Y-%m-%d)"
          git push
